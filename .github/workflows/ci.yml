name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: 小程序静态自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: tools/check.mjs（JS/JSON/WXML 绑定/配置约束）
        run: node tools/check.mjs

  smoke:
    name: 连沙箱冒烟
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
        with:
          path: miniapp
      - name: 取配套沙箱仓库
        uses: actions/checkout@v4
        with:
          repository: lluxuanyu752-rgb/mock-checkin-lab
          path: sandbox
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 启动沙箱
        working-directory: sandbox
        run: |
          LAB_CLASSROOM_SECRET=TESTSEC1 HOST=127.0.0.1 PORT=8787 nohup python server.py > ../server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8787/api/config > /dev/null; then echo "沙箱就绪"; exit 0; fi
            sleep 0.5
          done
          echo "沙箱启动超时"; cat ../server.log; exit 1
      - name: tools/smoke.mjs（CI 里用回环地址代替局域网 IP）
        working-directory: miniapp
        run: node tools/smoke.mjs --lan 127.0.0.1
      - name: 失败时输出沙箱日志
        if: failure()
        run: cat server.log || true
